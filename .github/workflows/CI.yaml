name: STM32 Full Build CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install dependencies
      - name: Install toolchain & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            make \
            python3 \
            srecord 

      # 3. Make scripts executable
      - name: Make scripts executable
        run: find . -name "*.sh" -exec chmod +x {} \;

      # 4. Run your build
      - name: Run full build
        run: ./combined_image/FULL_IMAGE.sh

      - name: Upload BM artifact
        uses: actions/upload-artifact@v4
        with:
          name: BM
          path: BM/Tools/*.elf

      - name: Upload BTLD artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTLD
          path: BTLD/Tools/*.elf

      - name: Upload Application artifact
        uses: actions/upload-artifact@v4
        with:
          name: Application
          path: APP/Tools/*.elf

      # 5. Upload final hex
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: full-image
          path: combined_image/full_image.hex
      - name: Firmware size
        run: arm-none-eabi-size BM/Tools/*.elf BTLD/Tools/*.elf APP/Tools/*.elf      
  Static_Analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      
      - name: Run cppcheck analysis
        id: cppcheck
        run: |
          # Run cppcheck and capture exit code
          cppcheck --enable=all \
                   --force \
                   --inconclusive \
                   --xml \
                   --xml-version=2 \
                   --output-file=cppcheck-report.xml \
                   --suppress=*:/usr/include/* \
                   . 2>&1 | tee cppcheck-output.log
          
          # Extract statistics
          if [ -f cppcheck-report.xml ]; then
            ERROR_COUNT=$(grep -c 'severity="error"' cppcheck-report.xml || echo "0")
            WARNING_COUNT=$(grep -c 'severity="warning"' cppcheck-report.xml || echo "0")
            STYLE_COUNT=$(grep -c 'severity="style"' cppcheck-report.xml || echo "0")
            
            echo "ERROR_COUNT=$ERROR_COUNT" >> $GITHUB_OUTPUT
            echo "WARNING_COUNT=$WARNING_COUNT" >> $GITHUB_OUTPUT
            echo "STYLE_COUNT=$STYLE_COUNT" >> $GITHUB_OUTPUT
            
            # Fail if errors
            if [ $ERROR_COUNT -gt 0 ]; then
              exit 1
            fi
          fi
      
      - name: Upload cppcheck report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.xml
        if: always()
      
      - name: Comment PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const errors = ${{ steps.cppcheck.outputs.ERROR_COUNT || 0 }};
            const warnings = ${{ steps.cppcheck.outputs.WARNING_COUNT || 0 }};
            const style = ${{ steps.cppcheck.outputs.STYLE_COUNT || 0 }};
            
            let status = errors > 0 ? '❌ **FAILED**' : '✅ **PASSED**';
            let color = errors > 0 ? '#ff0000' : '#00ff00';
            
            const comment = `
            ## 🔍 Static Analysis Results (CppCheck)
            
            | Status | ${status} |
            |--------|----------|
            | ❌ Errors | **${errors}** |
            | ⚠️ Warnings | ${warnings} |
            | 💅 Style | ${style} |
            
            ${errors > 0 ? '**Build failed due to static analysis errors!** Please check the artifacts for details.' : 'No critical errors found. Great job! 🎉'}
            
            <details>
            <summary>📥 Download Full Report</summary>
            
            Download the **cppcheck-report** artifact from the workflow run to see all issues.
            </details>
            `;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Static Analysis Results'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }