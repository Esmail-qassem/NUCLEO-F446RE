name: STM32 Firmware CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  MAX_FLASH_BYTES: 524288   # 512 KB
  MAX_RAM_BYTES:   131072   # 128 KB

# ═════════════════════════════════════════════════════════════
# JOB 1 — Build
# ═════════════════════════════════════════════════════════════
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain & tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-arm-none-eabi make python3 srecord

      - name: Make scripts executable
        run: find . -name "*.sh" -exec chmod +x {} \;

      - name: Build full image
        run: ./combined_image/FULL_IMAGE.sh

      - name: Check binary size limits
        run: |
          echo "=============================="
          echo "  FIRMWARE SIZE REPORT"
          echo "=============================="
          arm-none-eabi-size BM/Tools/*.elf BTLD/Tools/*.elf APP/Tools/*.elf

          check_size() {
            local elf="$1"
            local label="$2"
            read text data bss < <(arm-none-eabi-size "$elf" | awk 'NR==2{print $1, $2, $3}')
            local flash=$(( text + data ))
            local ram=$(( data + bss ))
            echo "$label => Flash: ${flash}B / ${{ env.MAX_FLASH_BYTES }}B  RAM: ${ram}B / ${{ env.MAX_RAM_BYTES }}B"
            if [ "$flash" -gt "${{ env.MAX_FLASH_BYTES }}" ]; then
              echo "FAIL: $label exceeds flash limit!"; exit 1
            fi
            if [ "$ram" -gt "${{ env.MAX_RAM_BYTES }}" ]; then
              echo "FAIL: $label exceeds RAM limit!"; exit 1
            fi
          }

          check_size BM/Tools/*.elf   "BM  "
          check_size BTLD/Tools/*.elf "BTLD"
          check_size APP/Tools/*.elf  "APP "

      - name: Section breakdown (APP)
        run: arm-none-eabi-objdump -h APP/Tools/*.elf

      - name: Upload BM ELF
        uses: actions/upload-artifact@v4
        with:
          name: BM
          path: BM/Tools/*.elf

      - name: Upload BTLD ELF
        uses: actions/upload-artifact@v4
        with:
          name: BTLD
          path: BTLD/Tools/*.elf

      - name: Upload APP ELF
        uses: actions/upload-artifact@v4
        with:
          name: Application
          path: APP/Tools/*.elf

      - name: Upload combined hex
        uses: actions/upload-artifact@v4
        with:
          name: full-image
          path: combined_image/full_image.hex


# ═════════════════════════════════════════════════════════════
# JOB 2 — Static Analysis
# ═════════════════════════════════════════════════════════════
  static_analysis:
    name: "Static Analysis"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cppcheck clang-tidy

      - name: Discover include paths
        id: includes
        run: |
          INCLUDE_FLAGS=$(find . -name "*.h" ! -path "./.git/*" ! -path "*/Tools/*" \
            -exec dirname {} \; | sort -u | sed 's/^/-I/' | tr '\n' ' ')
          echo "INCLUDE_FLAGS=$INCLUDE_FLAGS" >> $GITHUB_OUTPUT
          echo "Discovered include dirs:"
          echo "$INCLUDE_FLAGS" | tr ' ' '\n'

      # ── cppcheck ──────────────────────────────────────────
      # -i flag excludes directories from analysis.
      # Correct cppcheck syntax: -i <path>  (not --exclude)
      - name: Run cppcheck
        id: cppcheck
        continue-on-error: true
        run: |
          SUPPRESS=""
          if [ -f cppcheck-suppressions.txt ]; then
            SUPPRESS="--suppressions-list=cppcheck-suppressions.txt"
          fi

          INCLUDE_FLAGS="${{ steps.includes.outputs.INCLUDE_FLAGS }}"

          cppcheck \
            --enable=warning,style,performance,portability \
            --platform=arm32-wchar_t2 \
            --std=c11 \
            --force \
            --xml --xml-version=2 \
            --output-file=cppcheck-report.xml \
            --suppress=missingIncludeSystem \
            $SUPPRESS \
            $INCLUDE_FLAGS \
            -i APP/Tools \
            -i BTLD/Tools \
            -i BM/Tools \
            APP BTLD BM 2>&1 | tee cppcheck-output.log

          ERROR_COUNT=0
          WARNING_COUNT=0

          if [ -f cppcheck-report.xml ] && [ -s cppcheck-report.xml ]; then
            ERROR_COUNT=$(grep -c 'severity="error"'   cppcheck-report.xml || echo 0)
            WARNING_COUNT=$(grep -c 'severity="warning"' cppcheck-report.xml || echo 0)
          fi

          ERROR_COUNT=${ERROR_COUNT//[[:space:]]/}
          WARNING_COUNT=${WARNING_COUNT//[[:space:]]/}

          echo "ERROR_COUNT=$ERROR_COUNT"     >> $GITHUB_OUTPUT
          echo "WARNING_COUNT=$WARNING_COUNT" >> $GITHUB_OUTPUT
          echo "cppcheck: $ERROR_COUNT errors, $WARNING_COUNT warnings"

      # ── clang-tidy ────────────────────────────────────────
      - name: Run clang-tidy
        id: clang_tidy
        continue-on-error: true
        run: |
          find APP BTLD BM \
            -name "*.c" \
            ! -path "*/Tools/*" \
            ! -path "*/tools/*" \
            ! -path "*/build/*" \
            > source_files.txt

          echo "Files to analyze:"
          cat source_files.txt

          INCLUDE_FLAGS=$(find . -name "*.h" ! -path "./.git/*" ! -path "*/Tools/*" \
            -exec dirname {} \; | sort -u | sed 's/^/-I/' | tr '\n' ' ')

          TIDY_ERRORS=0
          while IFS= read -r src; do
            clang-tidy "$src" \
              --checks="-*,bugprone-*,cert-*,clang-analyzer-*,misc-*,readability-*,-readability-magic-numbers,-readability-function-cognitive-complexity,-misc-include-cleaner,-readability-identifier-length" \
              -- \
              -std=c11 \
              -DSTM32F446xx \
              -DUSE_BARE_METAL \
              $INCLUDE_FLAGS \
              2>&1 | grep -v "clang-diagnostic-error" \
                   | tee -a clang-tidy-output.log \
              || TIDY_ERRORS=$((TIDY_ERRORS + 1))
          done < source_files.txt

          echo "TIDY_ERRORS=$TIDY_ERRORS" >> $GITHUB_OUTPUT
          echo "clang-tidy: $TIDY_ERRORS file(s) with issues"

      - name: Fail on cppcheck errors
        if: steps.cppcheck.outputs.ERROR_COUNT != '0'
        run: |
          echo "cppcheck found ${{ steps.cppcheck.outputs.ERROR_COUNT }} errors"
          exit 1

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            cppcheck-report.xml
            cppcheck-output.log
            clang-tidy-output.log

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const errors   = parseInt('${{ steps.cppcheck.outputs.ERROR_COUNT }}')   || 0;
            const warnings = parseInt('${{ steps.cppcheck.outputs.WARNING_COUNT }}') || 0;
            const tidy     = parseInt('${{ steps.clang_tidy.outputs.TIDY_ERRORS }}') || 0;
            const status   = errors > 0 ? 'FAILED' : 'PASSED';

            const body = `## Static Analysis Results\n| Tool | Status | Errors | Warnings |\n|------|--------|--------|----------|\n| cppcheck   | ${errors > 0 ? 'FAIL' : 'PASS'} | **${errors}** | ${warnings} |\n| clang-tidy | ${tidy  > 0 ? 'WARN' : 'PASS'} | - | ${tidy} files |\n\n**Overall: ${status}**\n\nDownload the \`static-analysis-reports\` artifact for the full XML report.`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const bot = comments.find(c =>
                c.user.type === 'Bot' && c.body.includes('Static Analysis Results')
              );
              if (bot) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: bot.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, body,
                });
              }
            } catch (error) {
              core.warning('PR comment failed: ' + error.message);
            }


# ═════════════════════════════════════════════════════════════
# JOB 3 — Unit Tests (Unity, runs on host x86)
# ═════════════════════════════════════════════════════════════
  unit_tests:
    name: "Unit Tests (Unity)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install host GCC
        run: sudo apt-get update -q && sudo apt-get install -y gcc make

      - name: Check for test directory
        id: check_tests
        run: |
          if [ -d "tests" ] && [ -f "tests/Makefile" ]; then
            echo "HAS_TESTS=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_TESTS=false" >> $GITHUB_OUTPUT
            echo "No tests/ directory found. Skipping."
          fi

      - name: Download Unity framework
        if: steps.check_tests.outputs.HAS_TESTS == 'true'
        run: |
          mkdir -p tests/unity
          curl -sSL https://raw.githubusercontent.com/ThrowTheSwitch/Unity/master/src/unity.c \
            -o tests/unity/unity.c
          curl -sSL https://raw.githubusercontent.com/ThrowTheSwitch/Unity/master/src/unity.h \
            -o tests/unity/unity.h
          curl -sSL https://raw.githubusercontent.com/ThrowTheSwitch/Unity/master/src/unity_internals.h \
            -o tests/unity/unity_internals.h

      - name: Build and run tests
        if: steps.check_tests.outputs.HAS_TESTS == 'true'
        run: |
          cd tests
          make all 2>&1 | tee ../test-output.log
          make run  2>&1 | tee -a ../test-output.log

      - name: Parse test results
        if: steps.check_tests.outputs.HAS_TESTS == 'true'
        run: |
          PASSED=$(grep -c ":PASS"   test-output.log || echo 0)
          FAILED=$(grep -c ":FAIL"   test-output.log || echo 0)
          echo "Tests: $PASSED passed, $FAILED failed"
          if [ "$FAILED" -gt 0 ]; then
            grep ":FAIL" test-output.log
            exit 1
          fi

      - name: Upload test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-output.log